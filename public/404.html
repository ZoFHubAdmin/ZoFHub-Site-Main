    .nf-btn--primary{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow-glow-brand);}
    .nf-btn--ghost{background:var(--surface-hi);color:var(--text);border:1px solid var(--line);}
    .nf-links{margin-top:22px;font-size:14px;color:var(--text-mute);}
    .nf-links a{color:var(--text-dim);text-decoration:none;}
