<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1a0b3d" />
  <title>AI · ZoFHub</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lilita+One&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lilita+One&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lilita+One&display=swap" /></noscript>
  <link rel="stylesheet" href="/css/main.css?v=20260712" />
  <link rel="stylesheet" href="/css/ai.css?v=20260712" />
</head>
<body class="page-ai">

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span class="brand-wordmark">ZoFHub</span>
      </a>
      <div class="header-spacer"></div>
      <nav class="top-nav">
        <a href="/">Games</a>
        <a href="/ai" class="active">AI</a>
        <a href="/community">Community</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/browser">Browser</a>
      </nav>
    </div>
  </header>

  <main class="ai-shell">
    <aside class="ai-side">
      <button class="ai-new" id="aiNew">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="ai-side-label">History <button class="ai-clear-all" id="aiClearAll" type="button" title="Delete all chats" hidden>Clear all</button></div>
      <div class="ai-history" id="aiHistory"></div>

      <div class="ai-side-foot">
        <div class="ai-engine-status" id="aiEngineStatus">Connecting to AI…</div>
      </div>
    </aside>

    <section class="ai-main">
      <div class="ai-messages" id="aiMessages">
        <div class="ai-welcome">
          <div class="ai-welcome-mark"></div>
          <h1>ZoFHub AI</h1>
          <p>Ask anything — homework help, brainstorming, writing, code. Free &amp; unlimited.</p>
          <div class="ai-suggest">
            <button class="ai-suggest-card" data-prompt="Explain photosynthesis like I'm 10."><b>Explain</b><span>Photosynthesis, but simple</span></button>
            <button class="ai-suggest-card" data-prompt="/image a neon space cat surfing a comet"><b>/image</b><span>Generate a picture</span></button>
            <button class="ai-suggest-card" data-prompt="Give me 5 fun game ideas to try on ZoFHub."><b>Ideas</b><span>What should I play?</span></button>
            <button class="ai-suggest-card" data-prompt="Write a JavaScript function that shuffles an array."><b>Code</b><span>Write some code</span></button>
          </div>
        </div>
      </div>

      <form class="ai-composer" id="aiForm">
        <textarea id="aiInput" rows="1" placeholder="Ask ZoFHub AI…" required></textarea>
        <button type="submit" class="ai-send" id="aiSend" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
      <div class="ai-hint">Enter to send · Shift+Enter for newline · <b>/image</b> draw a picture · free &amp; unlimited</div>
    </section>
  </main>

  <script type="module" src="/js/layout.js?v=20260712"></script>
  <script type="module" src="/js/panic.js?v=20260712"></script>
  <script type="module" src="/js/ai.js?v=20260712"></script>
</body>
</html>
