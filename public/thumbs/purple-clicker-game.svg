<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Neon purple cursor with click ripples">
  <!-- Original generic artwork for ZoFHub. Clicker/idle theme.
       No third-party asset, no game branding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33206e"/><stop offset="1" stop-color="#150c2e"/>
    </linearGradient>
    <linearGradient id="ptr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d9ff"/><stop offset="1" stop-color="#b070ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="170" fill="url(#halo)"/>

  <!-- click ripples -->
  <g fill="none" stroke="#c084fc" stroke-linecap="round">
    <circle cx="200" cy="200" r="62"  stroke-width="7" opacity=".95"/>
    <circle cx="200" cy="200" r="98"  stroke-width="5" opacity=".6"/>
    <circle cx="200" cy="200" r="134" stroke-width="3.5" opacity=".33"/>
    <circle cx="200" cy="200" r="168" stroke-width="2.5" opacity=".16"/>
  </g>

  <!-- cursor -->
  <g transform="translate(172 150)">
    <path d="M0 0 L0 104 L25 80 L41 116 L64 105 L47 70 L80 66 Z"
          fill="url(#ptr)" stroke="#2a1250" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#e9d5ff">
    <path d="M112 108 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" opacity=".9"/>
    <path d="M300 262 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" opacity=".75"/>
    <path d="M292 118 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity=".55"/>
  </g>
</svg>
