<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Top-down battle-royale map with a shrinking play zone">
  <!-- Original generic artwork for ZoFHub. Top-down battle-royale theme:
       a shrinking safe zone over abstract terrain. No third-party asset, no
       game branding, no map traced from any real game. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3d2b"/><stop offset="1" stop-color="#122417"/>
    </linearGradient>
    <radialGradient id="safe" cx="46%" cy="44%" r="34%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#ground)"/>

  <!-- terrain: water inlet + clearings + treeline dots -->
  <path d="M0 300 Q70 268 120 300 T260 318 T400 288 L400 400 L0 400 Z" fill="#15406b" opacity=".55"/>
  <g fill="#2b5c3d" opacity=".75">
    <ellipse cx="96" cy="132" rx="58" ry="40"/>
    <ellipse cx="300" cy="228" rx="66" ry="44"/>
  </g>
  <g fill="#0f2a1a" opacity=".85">
    <circle cx="58" cy="72" r="9"/><circle cx="92" cy="52" r="7"/><circle cx="132" cy="82" r="8"/>
    <circle cx="340" cy="86" r="9"/><circle cx="366" cy="128" r="7"/><circle cx="308" cy="60" r="6"/>
    <circle cx="46" cy="230" r="8"/><circle cx="82" cy="262" r="6"/><circle cx="150" cy="356" r="7"/>
  </g>

  <!-- crates -->
  <g fill="#8a6a3a" stroke="#0f2a1a" stroke-width="3">
    <rect x="168" y="150" width="26" height="26" rx="3"/>
    <rect x="214" y="238" width="22" height="22" rx="3"/>
  </g>

  <!-- outer boundary (the closing edge) -->
  <circle cx="184" cy="176" r="150" fill="none" stroke="#ff3d8b" stroke-width="5"
          stroke-dasharray="16 12" opacity=".85"/>
  <!-- the safe zone -->
  <circle cx="184" cy="176" r="96" fill="url(#safe)" stroke="#22d3ee" stroke-width="6"/>

  <!-- centre marker -->
  <g stroke="#e6fbff" stroke-width="5" stroke-linecap="round">
    <path d="M184 148 V166"/><path d="M184 186 V204"/>
    <path d="M156 176 H174"/><path d="M194 176 H212"/>
  </g>
  <circle cx="184" cy="176" r="7" fill="#ffd426"/>
</svg>
