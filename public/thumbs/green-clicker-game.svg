<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Neon green cursor with click ripples">
  <!-- Original generic artwork for ZoFHub. Clicker/idle theme. Deliberately the
       same composition as purple-clicker-game.svg in the site's lime accent, so
       the pair reads as a set in the grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a2a"/><stop offset="1" stop-color="#0e1c14"/>
    </linearGradient>
    <linearGradient id="ptr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaffd0"/><stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a3e635" stop-opacity=".5"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="170" fill="url(#halo)"/>

  <g fill="none" stroke="#a3e635" stroke-linecap="round">
    <circle cx="200" cy="200" r="62"  stroke-width="7" opacity=".95"/>
    <circle cx="200" cy="200" r="98"  stroke-width="5" opacity=".6"/>
    <circle cx="200" cy="200" r="134" stroke-width="3.5" opacity=".33"/>
    <circle cx="200" cy="200" r="168" stroke-width="2.5" opacity=".16"/>
  </g>

  <g transform="translate(172 150)">
    <path d="M0 0 L0 104 L25 80 L41 116 L64 105 L47 70 L80 66 Z"
          fill="url(#ptr)" stroke="#122a0f" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <g fill="#ecfccb">
    <path d="M112 108 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" opacity=".9"/>
    <path d="M300 262 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" opacity=".75"/>
    <path d="M292 118 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity=".55"/>
  </g>
</svg>
