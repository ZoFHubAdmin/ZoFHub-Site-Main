<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Isometric voxel blocks">
  <!-- Original generic artwork for ZoFHub. Voxel/sandbox theme, built from plain
       isometric geometry. No third-party asset, no game branding, no texture
       copied from any voxel game. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a86"/><stop offset="1" stop-color="#160f33"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="312" cy="82" r="34" fill="#ffd426" opacity=".9"/>

  <!-- Isometric cube: top rhombus, then left and right faces.
       Half-width 46, half-height 26, body height 52. -->
  <g stroke="#100a24" stroke-width="3" stroke-linejoin="round">

    <!-- back row -->
    <g transform="translate(200 158)">
      <path d="M0 -26 L46 0 L0 26 L-46 0 Z" fill="#7c5cf0"/>
      <path d="M-46 0 L0 26 L0 78 L-46 52 Z" fill="#5a3fc0"/>
      <path d="M46 0 L0 26 L0 78 L46 52 Z" fill="#472f9e"/>
    </g>

    <!-- middle row, two cubes -->
    <g transform="translate(154 210)">
      <path d="M0 -26 L46 0 L0 26 L-46 0 Z" fill="#a3e635"/>
      <path d="M-46 0 L0 26 L0 78 L-46 52 Z" fill="#6f9c22"/>
      <path d="M46 0 L0 26 L0 78 L46 52 Z" fill="#587d18"/>
    </g>
    <g transform="translate(246 210)">
      <path d="M0 -26 L46 0 L0 26 L-46 0 Z" fill="#22d3ee"/>
      <path d="M-46 0 L0 26 L0 78 L-46 52 Z" fill="#189aae"/>
      <path d="M46 0 L0 26 L0 78 L46 52 Z" fill="#127d8e"/>
    </g>

    <!-- front row -->
    <g transform="translate(200 262)">
      <path d="M0 -26 L46 0 L0 26 L-46 0 Z" fill="#ff6fa5"/>
      <path d="M-46 0 L0 26 L0 78 L-46 52 Z" fill="#d13d76"/>
      <path d="M46 0 L0 26 L0 78 L46 52 Z" fill="#ab2f5e"/>
    </g>

    <!-- one floating block, to read as "buildable" -->
    <g transform="translate(96 120) scale(.62)">
      <path d="M0 -26 L46 0 L0 26 L-46 0 Z" fill="#ffd426"/>
      <path d="M-46 0 L0 26 L0 78 L-46 52 Z" fill="#d0a800"/>
      <path d="M46 0 L0 26 L0 78 L46 52 Z" fill="#a88800"/>
    </g>
  </g>
</svg>
