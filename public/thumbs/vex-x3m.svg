<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Stickman leaping between angled platforms">
  <!-- Original generic artwork for ZoFHub. Stick-figure platformer theme.
       No third-party asset, no game branding, no character likeness. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2065"/><stop offset="1" stop-color="#140d2c"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2b86"/><stop offset="1" stop-color="#241a55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#ffd426" stop-opacity=".22"/><stop offset="1" stop-color="#ffd426" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- faint grid, for depth -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="1">
    <path d="M0 80H400M0 160H400M0 240H400M0 320H400"/>
    <path d="M80 0V400M160 0V400M240 0V400M320 0V400"/>
  </g>

  <!-- angled platforms -->
  <g fill="url(#plat)" stroke="#6b53d8" stroke-width="2.5" stroke-linejoin="round">
    <path d="M12 300 L150 268 L150 296 L12 328 Z"/>
    <path d="M246 232 L392 200 L392 228 L246 260 Z"/>
    <path d="M40 168 L128 152 L128 176 L40 192 Z"/>
  </g>

  <!-- jump arc -->
  <path d="M140 262 Q205 176 254 230" fill="none" stroke="#22d3ee" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="10 13" opacity=".8"/>

  <!-- stick figure, mid-leap -->
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="200" cy="176" r="19" fill="#ffffff" stroke="none"/>
    <path d="M200 196 V240"/>
    <path d="M200 208 L170 190"/>
    <path d="M200 208 L234 196"/>
    <path d="M200 240 L178 276"/>
    <path d="M200 240 L228 270"/>
  </g>

  <!-- speed marks -->
  <g stroke="#ffd426" stroke-width="6" stroke-linecap="round" opacity=".85">
    <path d="M112 196 H70"/><path d="M126 218 H92"/><path d="M120 240 H84"/>
  </g>
</svg>
