name: CI

# Runs on every push to main and on pull requests. No secrets required — the
# server boots on its bundled catalog when Supabase env vars are absent, so this
# just answers one question fast: "does the code still start?"
on:
  push:
    branches: [main]
  pull_request:

jobs:
  startup-check:
    runs-on: ubuntu-latest
    env:
      CRON_DISABLED: "1"     # don't run the background cron jobs during the check
      PORT: "8099"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --omit=dev on purpose: this job boots the server, and the server runs on
      # production dependencies. Installing devDependencies here would mean the
      # thing being smoke-tested is not the thing that gets deployed.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax-check all JavaScript
        run: |
          node --check server.js
          for f in lib/*.mjs tools/*.mjs test/*.mjs *.js; do node --check "$f"; done

      # Front-end ES modules, which `node --check` above never sees: they are
      # served as static assets, so nothing imports them and no test loads them.
      # That includes admin-ui/, where a parse error means an administrator
      # locked out of their own console by a blank page.
      - name: Syntax-check front-end modules
        run: npm run check

      - name: Boot the server and check /api/health
        run: |
          node server.js &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          if [ "$ok" = "1" ]; then
            echo "✅ server booted and /api/health responded"
          else
            echo "::error::server failed to start or /api/health never responded"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Guards the Supabase GitHub integration.
  #
  # The integration applies everything in supabase/migrations/ to the PRODUCTION
  # database on merge to main. That directory is a GENERATED MIRROR of db/ (see
  # tools/sync-supabase-migrations.mjs) — db/ is where schema is authored and
  # where every doc points. If someone edits db/ and forgets to re-run the
  # generator, the mirror goes stale and Supabase applies the OLD schema, with no
  # error anywhere: production silently diverges from the SQL in this repo.
  #
  # This job makes that impossible to merge. It is intentionally separate from
  # startup-check so the failure reads as "migrations are stale", not "app broke".
  # ───────────────────────────────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    env:
      CRON_DISABLED: "1"     # background jobs must not fire during tests
      TEST_PORT: "3399"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --omit=dev

      # node:test is built into Node 22, so the suite needs no test framework
      # and no extra install step. Runs with NO secrets: the server falls back
      # to its bundled catalog when Supabase is unconfigured, because a test
      # that requires production keys is a test nobody runs.
      - name: Run the test suite
        run: npm test

  migrations-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: supabase/migrations must match db/
        run: |
          if node tools/sync-supabase-migrations.mjs --check; then
            echo "✅ supabase/migrations is a faithful mirror of db/"
          else
            echo "::error::supabase/migrations is out of sync with db/. Run 'npm run sync-migrations' and commit the result — otherwise Supabase will apply a stale schema to production."
            exit 1
          fi

      - name: Migration filenames must match Supabase's required format
        run: |
          # Supabase orders migrations lexicographically by filename and requires
          # a 14-digit YYYYMMDDHHMMSS prefix. A malformed name is either skipped
          # or applied out of order — both corrupt the dependency chain (the
          # `status` column must exist before scores_review/scores_unique run).
          fail=0
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f")
            if ! echo "$b" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error file=$f::'$b' must be <14-digit timestamp>_snake_case_name.sql"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "✅ all migration filenames are valid" || exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Prove the migrations actually APPLY, against a real Postgres.
  #
  # WHY THIS MATTERS MORE HERE THAN IN MOST REPOS: the Supabase GitHub
  # integration applies supabase/migrations/ straight to the PRODUCTION database
  # on merge to main. There is no staging gate. So the first execution of a
  # broken migration would otherwise be against production data.
  #
  # migrations-in-sync above proves the files MATCH db/. It cannot prove they
  # RUN. This job runs them, in filename order, and then runs them all a second
  # time to prove the idempotency every one of them claims in its header
  # (IF NOT EXISTS / OR REPLACE / guarded DROPs).
  #
  # THIS IS NOT A DEPLOY PATH. It applies to a throwaway container and never
  # touches a real project — no secrets, no network, nothing to leak. Migrations
  # continue to reach production solely through the Supabase GitHub integration;
  # a second deploy path would be two systems racing to apply the same DDL.
  #
  # postgres:15 matches `major_version = 15` in supabase/config.toml.
  # ───────────────────────────────────────────────────────────────────────────
  migrations-apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zofhub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d zofhub_ci
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create the roles Supabase's platform provides
        run: |
          # Stock Postgres has no anon/authenticated/service_role. Six
          # `revoke all on function … from public, anon, authenticated` statements
          # in these migrations reference them and would fail without these roles.
          # Supabase creates them as part of the platform, so creating them here
          # reproduces the target environment rather than working around it.
          $PSQL -c "do \$\$ begin
            if not exists (select 1 from pg_roles where rolname='anon')          then create role anon          nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role')  then create role service_role  nologin noinherit bypassrls; end if;
          end \$\$;"

      - name: Apply every migration in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── $(basename "$f")"
            $PSQL -q -f "$f" || { echo "::error file=$f::migration failed to apply"; exit 1; }
          done
          echo "✅ all migrations applied cleanly, in order"

      - name: Apply them all a SECOND time (idempotency)
        run: |
          # Every migration header promises it is idempotent. The Supabase
          # integration can legitimately re-run a file against a database that
          # already has the schema, so a migration that only works on an empty
          # database is a production outage waiting for a retry.
          for f in $(ls supabase/migrations/*.sql | sort); do
            $PSQL -q -f "$f" || { echo "::error file=$f::not idempotent — failed on re-apply"; exit 1; }
          done
          echo "✅ re-applying every migration is a no-op, as each header claims"

      - name: RLS must be enabled on every public table
        run: |
          # Deny-by-default is the posture these tables are documented to have.
          # A table that ships with RLS off is readable and writable by anyone
          # holding the publishable key, which is a key that lives in a browser-
          # facing config by design.
          missing=$($PSQL -tAc "select string_agg(c.relname, ', ')
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind='r' and not c.relrowsecurity;")
          if [ -n "$missing" ]; then
            echo "::error::RLS is DISABLED on: $missing"
            exit 1
          fi
          echo "✅ RLS is enabled on every table in the public schema"
