<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard · ZoFHub Admin</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">Z</span>
    <div><strong>ZoFHub Admin</strong></div>
  </div>
  <div class="topbar-right">
    <span id="whoami" class="who"></span>
    <button id="logoutAll" class="btn-ghost" type="button" title="Revoke every session, everywhere">Sign out everywhere</button>
    <button id="logout" class="btn-ghost" type="button">Sign out</button>
  </div>
</header>

<!-- role="tab" without aria-selected announces every tab as unselected, so a
     screen-reader operator cannot tell which panel they are on. The state is
     set here for the initial render and kept in step by admin.js. -->
<nav class="tabs" role="tablist" aria-label="Admin sections">
  <button class="tab is-active" data-panel="overview"  role="tab" id="tab-overview"  aria-controls="panel-overview"  aria-selected="true">Overview</button>
  <button class="tab" data-panel="games"     role="tab" id="tab-games"     aria-controls="panel-games"     aria-selected="false">Games</button>
  <button class="tab" data-panel="scores"    role="tab" id="tab-scores"    aria-controls="panel-scores"    aria-selected="false">Leaderboard</button>
  <button class="tab" data-panel="community" role="tab" id="tab-community" aria-controls="panel-community" aria-selected="false">Community</button>
  <button class="tab" data-panel="security"  role="tab" id="tab-security"  aria-controls="panel-security"  aria-selected="false">Security</button>
</nav>

<main id="main">
  <!-- role="status" (polite), not role="alert" (implicitly assertive): this one
       banner carries successes as well as errors, and role="alert" alongside
       aria-live="polite" was a contradiction the browser had to break a tie on. -->
  <p id="banner" class="msg" role="status" aria-live="polite" aria-atomic="true" hidden></p>

  <section class="panel is-active" data-panel="overview" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
    <div id="statGrid" class="stat-grid"></div>
    <h2>System</h2>
    <div id="sysGrid" class="kv-grid"></div>
  </section>

  <section class="panel" data-panel="games" id="panel-games" role="tabpanel" aria-labelledby="tab-games" tabindex="0">
    <!-- Catalog health first: it describes the whole set, and the search below
         only ever shows one page of it. -->
    <div id="qualityOut" class="quality"></div>
    <div class="row">
      <input id="gameSearch" type="search" placeholder="Search games by title or slug…" autocomplete="off">
      <button id="refreshCatalog" class="btn-ghost" type="button">Refresh catalog</button>
    </div>
    <div id="gamesOut" class="table-wrap"></div>
  </section>

  <section class="panel" data-panel="scores" id="panel-scores" role="tabpanel" aria-labelledby="tab-scores" tabindex="0">
    <!-- The whole leaderboard, not only the queue. Defaults to the quarantined
         scores because that is the view with work waiting in it. -->
    <div class="row">
      <input id="scoreSearch" type="search" placeholder="Search by player or game…" autocomplete="off">
      <label class="sel"><span class="sr-only">Status</span>
        <select id="scoreStatus">
          <option value="flagged">Awaiting review</option>
          <option value="ok">On the public board</option>
          <option value="rejected">Rejected</option>
          <option value="all">Every score</option>
        </select>
      </label>
      <label class="sel"><span class="sr-only">Sort</span>
        <select id="scoreSort">
          <option value="recent">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="highest">Highest score</option>
          <option value="lowest">Lowest score</option>
        </select>
      </label>
    </div>
    <p id="scoreMeta" class="hint"></p>
    <div id="scoresOut" class="table-wrap"></div>
    <div id="scorePager" class="pager"></div>
  </section>

  <section class="panel" data-panel="community" id="panel-community" role="tabpanel" aria-labelledby="tab-community" tabindex="0">
    <p class="hint">Community submissions. Hiding removes a post from the public wall without deleting it.</p>
    <div id="communityOut" class="table-wrap"></div>
  </section>

  <section class="panel" data-panel="security" id="panel-security" role="tabpanel" aria-labelledby="tab-security" tabindex="0">
    <h2>Active sessions</h2>
    <div id="sessionsOut" class="table-wrap"></div>
    <h2>Recent sign-in attempts</h2>
    <div id="loginsOut" class="table-wrap"></div>
    <h2>Security events</h2>
    <div id="eventsOut" class="table-wrap"></div>
    <h2>Audit trail <span class="hint-inline">append-only; cannot be edited or deleted from here</span></h2>
    <div id="auditOut" class="table-wrap"></div>
  </section>
</main>

<script src="/admin/assets/admin.js" type="module"></script>
</body>
</html>
