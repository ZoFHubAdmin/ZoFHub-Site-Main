<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ZoFHub Admin</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<!--
  MONITOR is the original five: Overview carries the whole picture and the
  other four go deeper on something it flagged. CONTENT and PLATFORM are the
  control plane (admin-control.js): they are where things are CHANGED, so they
  are grouped apart from where things are watched. Items a role cannot use are
  hidden by admin.js after /api/admin/me — a courtesy; the server enforces.

  FIVE monitoring sections, not eleven. The previous console split one operator's job
  across eleven nav items, which meant answering "is everything fine" required
  visiting eleven pages. Overview now carries the whole picture; the other four
  exist only to go deeper on something Overview has already flagged.

  Icons are inline SVG on purpose: the CSP blocks third-party stylesheets, so an
  icon-font CDN would fail silently and leave empty boxes in the nav.
-->
<body>
<div class="shell">

  <aside class="side" id="side">
    <div class="side-brand">
      <span class="brand-mark" role="img" aria-label="ZoFHub"></span>
      <div>
        <b>ZoFHub</b>
        <span>Admin console</span>
      </div>
    </div>

    <nav class="nav-group" aria-label="Monitor">
      <span class="nav-label">Monitor</span>
      <button class="nav-item" data-view="overview" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0"/><path d="m12 12 4-3"/><circle cx="12" cy="12" r="1.6"/></svg>
        Overview
      </button>
      <button class="nav-item" data-view="games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h4M8 9v4"/><circle cx="15.5" cy="11" r="1"/><circle cx="18" cy="13.5" r="1"/><rect x="2" y="6" width="20" height="12" rx="4"/></svg>
        Games
        <span class="nav-count" id="n-games"></span>
      </button>
      <button class="nav-item" data-view="players">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3.2"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 4.1a4 4 0 0 1 0 7.75"/></svg>
        Players
        <span class="nav-count" id="n-players"></span>
      </button>
      <button class="nav-item" data-view="money">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2A2.6 2.6 0 0 0 12 7.8c-1.5 0-2.6.9-2.6 2.1s1 1.7 2.6 2.1 2.6.9 2.6 2.1-1.1 2.1-2.6 2.1a2.6 2.6 0 0 1-2.5-1.4"/><path d="M12 6.4v11.2"/></svg>
        Money
      </button>
      <button class="nav-item" data-view="proxy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="7" cy="7" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="17" cy="17" r="1"/></svg>
        Proxy
        <span class="nav-count" id="n-tunnels"></span>
      </button>
      <button class="nav-item" data-view="system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        System
        <span class="nav-count" id="n-system"></span>
      </button>
    </nav>

    <nav class="nav-group" aria-label="Content">
      <span class="nav-label">Content</span>
      <button class="nav-item" data-view="content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h8M8 16h5"/></svg>
        Content
      </button>
      <button class="nav-item" data-view="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        Review
        <span class="nav-count" id="n-review"></span>
      </button>
      <button class="nav-item" data-view="taxonomy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        Taxonomy
      </button>
      <button class="nav-item" data-view="providers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>
        Providers
      </button>
    </nav>

    <nav class="nav-group" aria-label="Platform">
      <span class="nav-label">Platform</span>
      <button class="nav-item" data-view="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M17 11l2 2 3-3"/></svg>
        Staff
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5.9Z"/></svg>
        Settings
      </button>
      <button class="nav-item" data-view="proxyctl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg>
        Proxy control
      </button>
      <button class="nav-item" data-view="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>
        Audit
      </button>
      <button class="nav-item" data-view="account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        My account
      </button>
    </nav>

    <div class="side-foot">
      <div class="side-user">
        <span class="user-mark" id="user-mark" aria-hidden="true">·</span>
        <span class="who">
          <b id="who-name">—</b>
          <span id="who-via">signed in</span>
        </span>
      </div>
      <button class="btn" id="signout" style="width:100%;justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="btn side-open" id="side-open" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="view-title">Overview</h1>
      <span class="sub" id="view-sub"></span>
      <span class="spacer"></span>
      <span class="livechip idle" id="livechip" title="Visitors on the site right now">
        <span class="dot"></span><span id="live-n">—</span> live
      </span>
      <button class="btn" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
    </header>

    <div class="content">
      <p id="banner" class="msg error" role="alert" aria-live="polite" hidden></p>
      <div id="views"></div>
    </div>
  </main>

</div>
<script src="/admin/assets/admin.js" type="module"></script>
</body>
</html>
