# =============================================================================
# ZoFHub · Supabase CLI / branching config
# -----------------------------------------------------------------------------
# Consumed by the Supabase GitHub integration
# (Dashboard → Project Settings → Integrations → GitHub).
#
# WORKING DIRECTORY: this file lives at <repo root>/supabase/, so the
# integration's "working directory" field must be exactly:
#
#     .
#
# (The field wants the path from the repo root to the folder CONTAINING
# `supabase/` — not the path to `supabase/` itself. `.` is correct here. You
# would only enter something like `apps/web` for a monorepo whose layout is
# `apps/web/supabase/`.)
#
# Entering `supabase` instead makes the integration look for
# `supabase/supabase/migrations/`, find nothing, and apply nothing — with NO
# error shown anywhere. Same silent outcome if the connected REPOSITORY is not
# the repo you actually push to. Both are verified in supabase/README.md.
#
# CONNECTED REPOSITORY must be the same repo this working tree pushes to:
#     git remote get-url origin
# If the dashboard names a different owner/repo, migrations here can never run.
#
# WHAT RUNS: every file in supabase/migrations/ is applied, in filename order,
# to each preview branch and — once you merge to your production branch — to
# production. supabase/seed.sql runs on preview branches only.
#
# The migrations here are the SCHEMA only. The catalog's data lives in
# db/load-*.sql (~14 MB of INSERTs) and is deliberately NOT wired in: a preview
# branch does not need 16,818 games to prove a schema change is sound, and
# re-running that on every branch would be slow and pointless.
# =============================================================================

# Your project ref — the subdomain in SUPABASE_URL
# (https://jfflnuvqjlrcuqzyglnn.supabase.co). Not a secret: it is in every
# public API URL the browser already sends.
project_id = "jfflnuvqjlrcuqzyglnn"

[db]
# LOCAL-ONLY setting. This tells `supabase start` which Postgres to run in
# Docker; it does NOT configure, migrate, or upgrade the hosted database, and
# the GitHub integration ignores it entirely. A wrong value here cannot affect
# production — it only means local dev runs a different Postgres than prod.
#
# The hosted version is not readable through the REST API (PostgREST reports its
# OWN version there, e.g. "14.5", which is NOT the Postgres version — do not
# copy that number here). If you use `supabase start`, confirm the real value at
# Dashboard → Settings → Database → "Postgres version" and match it.
major_version = 15

[db.migrations]
# Applied in lexicographic filename order, so the leading timestamps are what
# actually enforce dependency order. That matters here: the `status` column has
# to exist before the review and uniqueness migrations reference it.
enabled = true

# No Edge Functions and no custom storage buckets in this project. Both sections
# are intentionally absent rather than empty-but-declared, so the integration
# has nothing to try to deploy.
