<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Metro Dash</title>
  <link rel="stylesheet" href="style.css" type="text/css">

  <!-- AdSense is enabled from the single CLIENT constant in the script at the
       bottom of this file. Until you set it, the ad rails stay hidden so players
       see a clean layout (no empty ad boxes). -->

</head>

<body>
  <div class="md-shell">
    <!-- Left skyscraper ad (auto-hidden on narrow screens so the game is never clipped) -->
    <aside class="md-ad md-ad-left">
      <ins class="adsbygoogle"
        style="display:inline-block;width:160px;height:600px"
        data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
        data-ad-slot="0000000001"></ins>
    </aside>

    <!-- Game stage: canvas + overlays are centered here -->
    <main class="md-stage">
      <canvas id="glcanvas" width="1024" height="800"></canvas>

      <div id="ModalBox" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <p class='game_title'></p>
            <p class="game_score" style="font-size: 20px;"></p>
            <div class="modal-footer" id="arrow" style="cursor:pointer;"></div>
            <p class="play_again" id="play_again" style="font-size: 25px;cursor:pointer;"></p>
          </div>
        </div>
      </div>

      <div id="GameScore" class="score">
        <div class="score_content">
          <div class="score_box">
            <h1>Score</h1>
            <h2 class="score_gain"></h2>
          </div>
        </div>
      </div>
    </main>

    <!-- Right skyscraper ad -->
    <aside class="md-ad md-ad-right">
      <ins class="adsbygoogle"
        style="display:inline-block;width:160px;height:600px"
        data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
        data-ad-slot="0000000002"></ins>
    </aside>
  </div>

  <!-- Bottom responsive leaderboard ad -->
  <div class="md-ad md-ad-bottom">
    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="0000000003"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
  </div>
</body>

<script type="text/javascript">
  // Ads: set CLIENT to your AdSense publisher ID (one place) to turn them on.
  // Until then the ad rails are hidden so players get a clean layout. Safe
  // no-op if the AdSense script is blocked — the game is unaffected either way.
  (function () {
    var CLIENT = 'ca-pub-XXXXXXXXXXXXXXXX'; // <-- your AdSense publisher ID
    var slots = document.querySelectorAll('ins.adsbygoogle');
    if (CLIENT.indexOf('XXXX') !== -1) { // not configured yet
      document.querySelectorAll('.md-ad').forEach(function (el) { el.style.display = 'none'; });
      return;
    }
    try {
      var s = document.createElement('script');
      s.async = true; s.crossOrigin = 'anonymous';
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + CLIENT;
      document.head.appendChild(s);
      slots.forEach(function (ins) {
        ins.setAttribute('data-ad-client', CLIENT);
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      });
    } catch (e) { /* ad blocker / offline — ignore */ }
  })();

  var modal = document.getElementById('ModalBox');
  var score = document.getElementById('GameScore');

  // -------------------------------------------------------------------------
  // Music: a CLEAN, self-generated WebAudio soundtrack. This replaces the old
  // copyrighted bgmusic.mp3 — no audio file is shipped or loaded, which also
  // removes the local <audio> file/CORS issue on Chrome.
  // -------------------------------------------------------------------------
  function createMusic() {
    var ctx = null, master = null, timer = null, step = 0, playing = false;
    var seq = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // C-E-G-C arpeggio
    function ensure() {
      if (ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.06; // gentle background level
      master.connect(ctx.destination);
    }
    function note() {
      if (!ctx) return;
      var t = ctx.currentTime;
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = seq[step % seq.length];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 0.3);
      step++;
    }
    return {
      play: function () {
        ensure();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        if (playing) return;
        playing = true; note(); timer = setInterval(note, 300);
      },
      stop: function () {
        playing = false;
        if (timer) { clearInterval(timer); timer = null; }
        if (ctx && ctx.state === 'running') ctx.suspend();
      }
    };
  }
  var music = createMusic();

  function start() {
    modal.style.display = "flex";
    x = document.querySelector(".game_title");
    x.textContent = "Metro Dash";
    y = document.querySelector(".play_again");
    y.style.display = "none";
  }

  document.getElementById("arrow").addEventListener("click", start_box);
  document.getElementById("play_again").addEventListener("click", restart_game);

  function start_box() {
    game_start = true;
    music.play();
    modal.style.display = "none";
    score.style.display = "flex";
  }

  function restart_game() { document.location.reload(); }

  function update_score() {
    x = document.querySelector(".score_gain");
    x.textContent = objects[0].score;
  }

  function Game_over() {
    modal.style.display = "flex";
    score.style.display = "none";

    x = document.querySelector(".game_title");
    if (game_over) x.textContent = "Game Over";
    else if (finish) x.textContent = "You Won!";

    y = document.querySelector(".game_score");
    y.textContent = "Your score: " + objects[0].score;
    y.style.display = "flex";

    z = document.querySelector(".modal-footer");
    z.style.display = "none";

    w = document.querySelector(".play_again");
    w.style.display = "flex";
    w.textContent = "Play Again";

    music.stop();
  }

  start();
</script>
