# ZoFHub — Render deploy blueprint (https://render.com).
# ─────────────────────────────────────────────────────────────────────────────
# WHY NOT VERCEL: ZoFHub is a PERSISTENT Express server — it runs node-cron jobs
# 24/7, holds the catalog + live-presence in memory, and serves the /wisp
# WebSocket tunnel for the proxy. Vercel's serverless functions can't do any of
# those. Use a persistent host: Render (this file), Railway, Fly.io, or a VPS.
#
# ZoFHub is ALWAYS a proxy site — the web proxy (GUST / Ultraviolet / Scramjet /
# Wisp) is always on. There is NO separate hub / Google-AdSense mode: Google bans
# proxy / anonymizer domains at the account level, so monetization is solely via
# six proxy-friendly ad networks, one role each (lib/ad-providers.mjs). This is
# ONE service, deployed once.
#
# NOTE: the FREE plan SLEEPS when idle, which stops the cron jobs + live presence.
# Use the cheapest always-on paid plan ("starter") for real use. Render injects
# PORT automatically; server.js reads process.env.PORT.
#
# SCALING: if you ever run more than one replica, they share ONE database, so set
# CRON_DISABLED=1 on EVERY replica except one (otherwise every cron write runs N
# times). A single instance — the default below — needs no such flag.
services:
  - type: web
    name: zofhub
    runtime: node
    plan: starter
    # --omit=dev is LOAD-BEARING, not tidiness. package.json's devDependencies
    # holds playwright, which pulls ~300 MB of browser binaries and is used by
    # exactly one manually-run local tool (y8-harvest.js). Nothing in server.js
    # or lib/ imports it. Plain `npm ci` installs devDependencies, so without
    # this flag moving a package to devDependencies changes NOTHING here — the
    # deploy still downloads it on every single build.
    #
    # Do not rely on NODE_ENV=production to imply this. That was npm 6
    # behaviour; on npm 7+ the reliable switch is the explicit flag, and the
    # Dockerfile already uses its equivalent (`npm install --omit=dev`).
    buildCommand: npm ci --omit=dev
    # `npm start` on purpose, so there is ONE definition of how this server
    # starts. This used to be a literal `node server.js` while package.json's
    # start script was `node --use-system-ca server.js` — meaning the process
    # running in production was not the process anyone tested locally, and any
    # future flag added to the start script would silently not apply here.
    startCommand: npm start
    # /healthz, NOT /api/health — this is the whole resource guard.
    #
    # /healthz is the only route that returns 503 when memory crosses
    # HEALTH_MEM_MAX_PCT (default 85%, worse of RSS-against-cgroup and V8 heap).
    # That 503 is what makes Render roll the container BEFORE the OOM killer
    # takes it, which is a graceful restart instead of a hard kill mid-request.
    # While this pointed at /api/health, that guard could never fire:
    # /api/health always answers 200 regardless of memory, so the ceiling was
    # computed, reported in the admin console, and acted on by nobody.
    #
    # /api/health is also the wrong shape for a probe: it runs a live Supabase
    # connectivity check (cached 30s), so a third party being down could have
    # marked THIS service unhealthy and restarted a perfectly good container.
    # /healthz touches no external service on the unauthenticated path.
    #
    # /healthz now also fails (503) on a SUSTAINED event-loop stall or after an
    # uncaught exception, not memory alone, and a breach must persist for
    # HEALTH_SUSTAIN_MS (default 10s) before it flips — so a one-off GC pause
    # cannot recycle a healthy container. /readyz is an alias of this verdict;
    # /livez is liveness only (503 just after an uncaught exception). Render has
    # one health check, so it points at /healthz, which does both jobs.
    healthCheckPath: /healthz
    autoDeploy: true
    # ── HOW ENV RESOLVES HERE (this bit is genuinely surprising) ─────────────
    # .env is COMMITTED in this repo, and server.js loads it at boot. Render's
    # own variables still win — process.loadEnvFile() never overwrites a value
    # already in the environment — but anything NOT declared below silently
    # falls back to whatever is in the committed .env. That is how a production
    # secret ends up being sourced from git without anyone deciding it should
    # be. So every secret the app reads is declared here, even the optional
    # ones; server.js also logs, in production, exactly which keys came from
    # the file instead of from this host.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The MACHINE token for /api/admin/* (catalog, analytics, security, system,
      # feedback), for monitors and CLI tooling that cannot hold a cookie. Auth
      # FAILS CLOSED, so without it every admin route refuses. Generated here so
      # the deployed value is never one that has been in a file on disk.
      - key: ADMIN_SECRET
        generateValue: true
      # GameFlare verification preview. UNSET IN PRODUCTION ON PURPOSE.
      # Setting it lets the player route resolve an unverified CANDIDATE, which
      # is needed only while a browser-verification run is in progress and is run
      # from an operator machine, not from this service (Playwright is a
      # devDependency and the build omits dev). Declared here so it is a decision
      # rather than an omission — leave it blank.
      - key: GAMEFLARE_VERIFY_TOKEN
        sync: false
      # ── the administrator console (username + password login) ───────────────
      # Declared here for the reason spelled out above: anything NOT listed is
      # silently sourced from the committed .env, and a login credential read
      # out of git is exactly the outcome that block warns about. Set these in
      # the dashboard; the local .env copy then only ever unlocks localhost.
      #
      # Generate the hash with `npm run admin-hash` — it prompts without echoing
      # and prints a scrypt string. The PLAINTEXT password is never stored
      # anywhere, in this file or otherwise.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Signs session cookies and keys the HMAC that turns client IPs into
      # non-reversible hashes. Generated here rather than synced so it never
      # exists outside Render at all. Render generates it once and keeps it
      # across deploys; changing it logs every admin out and breaks continuity
      # of the stored IP hashes, which is the intended effect of a rotation.
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # --- set these as SECRETS in the Render dashboard (never commit them) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false                # the public/browser key; SUPABASE_PUBLISHABLE_KEY is accepted too (same value)
      # The same value under the name current Supabase dashboards show. Declared
      # rather than left to the comment above, because an accepted-but-
      # undeclared name is one that gets picked up from the committed .env.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # lib/supabase.mjs also accepts the NEXT_PUBLIC_* spellings, for configs
      # copied over from a Next.js project. Declared for the same reason as the
      # line above: a name the resolver honours but this file omits is a name
      # that resolves out of the committed .env instead. Normally left unset.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # PREFERRED: the new-style secret key (sb_secret_…) from Settings → API
      # Keys. Bypasses RLS exactly like the legacy service_role JWT, which
      # Supabase retires at the end of 2026 and which can no longer be rotated.
      # Set THIS one; when both are present the secret key wins.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # LEGACY name. The `anon`/`service_role` pair has been DEACTIVATED on this
      # project — presenting an old key returns 401 "Legacy API keys are
      # disabled". Leave this UNSET: lib/load-env.mjs mirrors SUPABASE_SECRET_KEY
      # onto this name so the CLI tools that read it keep working. It stays
      # declared only so that setting it here, rather than picking it up from the
      # committed .env, remains the deliberate choice.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Advertising ──────────────────────────────────────────────────────
      # Six supported networks, each owning ONE role (lib/ad-providers.mjs):
      #   Ad-Maven interstitial · ExoClick header+sidebar · HilltopAds push ·
      #   Clickadu video pre-roll · Mondiad native · PopAds desktop popunder.
      # Each needs <NETWORK>_ENABLED=1 *and* its role variable — enabled without
      # configuration renders nothing. All unset = the site runs ad-free.
      #
      # ⚠ No network has approved this site. Every one reviews your specific
      #   domain, and ZoFHub hosts a web proxy — raise that with each of them
      #   before enabling. See docs/features/ADVERTISING.md.
      #
      # The role variables themselves (ADMAVEN_INTERSTITIAL_TAG / _URL,
      # EXOCLICK_HEADER_TAG / _SIDEBAR_TAG, HILLTOPADS_PUSH_SCRIPT,
      # CLICKADU_PREROLL_VAST, MONDIAD_NATIVE_TAG, POPADS_POPUNDER_TAG) and their
      # __<REGION> variants are set in the dashboard as needed; they are raw
      # HTML or ad-account URLs and are credentials, so they are never listed here.
      - key: ADMAVEN_ENABLED
        sync: false
      - key: EXOCLICK_ENABLED
        sync: false
      - key: HILLTOPADS_ENABLED
        sync: false
      - key: CLICKADU_ENABLED
        sync: false
      - key: MONDIAD_ENABLED
        sync: false
      - key: POPADS_ENABLED
        sync: false
      # Regional domains and regional ad tags (lib/geo.mjs). Optional; see
      # .env.example for the REGION_ROUTES format. GEO_COUNTRY_HEADER must name
      # a header your edge sets (Cloudflare: cf-ipcountry, the default).
      - key: REGION_ROUTES
        sync: false
      - key: GEO_COUNTRY_HEADER
        sync: false
      # The DMCA / privacy / terms contact shown on every legal page. Without it
      # those pages state that no contact address has been published — set this
      # so rights-holders and users actually have a way to reach you.
      - key: CONTACT_EMAIL
        sync: false
      - key: POLLINATIONS_REFERRER
        sync: false                # your domain (bare hostname), for AI attribution
      - key: CRON_SECRET
        sync: false                # protects /healthz DETAIL; set the SAME value in your uptime monitor
      # /healthz returns 503 above this memory percentage so Render can recycle
      # the instance cleanly instead of losing it to an OOM kill mid-request.
      # Optional — the code defaults to 85.
      - key: HEALTH_MEM_MAX_PCT
        sync: false
      # How long a memory/event-loop breach must persist before /healthz flips
      # to 503, so a transient spike cannot recycle a healthy instance.
      # Optional — the code defaults to 10000 (10s).
      - key: HEALTH_SUSTAIN_MS
        sync: false
      # Which X-Forwarded-For hops to trust when deriving the client IP that
      # every per-client control keys on. Behind Render's single edge the
      # default (1) is correct; set this only for a different topology (e.g. a
      # CDN in front of Render). See .env.example. Optional.
      - key: TRUST_PROXY
        sync: false
      # Per-client Wisp tunnel cap: one IP cannot hold more than this many
      # tunnels, so a single runaway client cannot starve the pool. Default 32.
      - key: WISP_MAX_PER_IP
        sync: false
      # Role the static ADMIN_SECRET bearer token runs as: operator (default)
      # or viewer. Never owner — see lib/admin-rbac.mjs.
      - key: ADMIN_SERVICE_ROLE
        sync: false
      # sing-box (docs/proxy/SINGBOX.md). ON BY DEFAULT in the Docker image, where it
      # is the proxy browser's egress. NOTE: Render's native Node runtime does
      # not build the binary, so on that runtime the supervisor reports it
      # missing once and every proxied stream falls back to a direct connection
      # — the site works, it is just not tunnelled. Deploy the Dockerfile to get
      # the real thing. All of these are optional overrides.
      - key: SINGBOX_EGRESS
        sync: false
      - key: SINGBOX_SOCKS
        sync: false
      - key: SINGBOX_REQUIRE
        sync: false
      - key: SINGBOX_DIAL_TIMEOUT_MS
        sync: false
      - key: SINGBOX_API_URL
        sync: false
      - key: SINGBOX_API_SECRET
        sync: false
      - key: SINGBOX_API_TIMEOUT_MS
        sync: false
      # Managed mode is ON unless set to 0. Needs the binary in the image
      # (Dockerfile build arg SINGBOX_VERSION, default v1.14.1), which Render's
      # native Node runtime does not build — this is for a Docker deploy.
      - key: SINGBOX_MANAGED
        sync: false
      - key: SINGBOX_BIN
        sync: false
      - key: SINGBOX_CONFIG_PATH
        sync: false
      - key: SINGBOX_CONFIG_TEMPLATE
        sync: false
      - key: SINGBOX_UUID_OWNER
        sync: false
      - key: SINGBOX_HANDSHAKE_HOST
        sync: false
      - key: SINGBOX_REALITY_PRIVATE_KEY
        sync: false
      - key: SINGBOX_REALITY_SHORT_ID
        sync: false
      # Extra script origins for the Content-Security-Policy. The origins in
      # every configured ad tag and loader are allowlisted automatically; set
      # this only when a network chains to a domain you never pasted. Without an
      # allowlist entry the BROWSER refuses the script — no error, no revenue,
      # and it looks exactly like the network not paying out. `npm run check-ads`
      # reports this before you find out the slow way.
      - key: PROXY_AD_ORIGINS
        sync: false
      - key: ADS_TXT_EXTRA
        sync: false                # only if a network hands you an ads.txt line
      # Public site URL (https://…). Without it the legal pages say "this
      # website" instead of naming the site, which reads badly on a DMCA policy.
      - key: SITE_URL
        sync: false
      # Free public pk_ key from enter.pollinations.ai — lifts the anonymous
      # per-IP limit on the AI chat. PUBLIC by design (it reaches the browser);
      # never put a secret sk_ key here.
      - key: POLLINATIONS_PUBLIC_KEY
        sync: false
      # Mirror-update list. The table stores addresses with no IP and no
      # timestamp (db/14_subscriber_emails.sql); these two are what let you
      # actually send to them. Optional — /api/subscribe still stores the row
      # with both unset, so the provider can be added later without data loss.
      # The key is read only on the server and never reaches a browser.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      # SECRET Pollinations keys — the opposite of the pk_ key above. Either name
      # is read (API_KEY wins), and either one moves the server-side AI path onto
      # the keyed gen.pollinations.ai endpoint. Undeclared, they would have come
      # from the committed .env.
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_TOKEN
        sync: false
      # Paid video-generation provider key. /api/ai/video reports "unavailable"
      # until it is set.
      - key: VIDEO_API_KEY
        sync: false
      # Optional Redis. Unset = a bounded in-process LRU, which is fine for ONE
      # instance but is not shared, so each replica would cache separately.
      - key: REDIS_URL
        sync: false
      # Alias read by lib/cache.mjs when REDIS_URL is unset. A Redis URL carries
      # its password inline, so it is a credential, not a setting.
      - key: UPSTASH_REDIS_URL
        sync: false
      # Set to 1 on EVERY replica except one if you ever scale past a single
      # instance — otherwise every cron write runs once per replica.
      - key: CRON_DISABLED
        sync: false
      # Kasm Workspaces (docs/proxy/KASM.md) — the address of a remote-desktop
      # container YOU run on a Docker host. This service cannot host it: there
      # is no Docker daemon inside a Render web service, and a session costs
      # gigabytes of RAM. Unset = the engine simply is not offered.
      #
      # Declared here for the reason at the top of this block: an undeclared
      # name resolves out of the committed .env instead. It is also the one
      # engine URL that people are tempted to write a password into, and
      # /api/proxies publishes it unauthenticated — server.js strips any
      # credential and logs that it did, but the value still belongs in the
      # dashboard rather than in git.
      - key: PROXY_KASM_URL
        sync: false
      - key: KASM_LABEL
        sync: false
      # InvisiProxy LTS (docs/proxy/INVISIPROXY.md) — an AGPL-3.0 proxy application
      # you deploy separately. ZoFHub ships none of its code; this is only the
      # address of your instance. Unset = the engine is not offered.
      - key: PROXY_INVISI_URL
        sync: false
      # MASQR proxy discovery gate (docs/proxy/MASQR.md). OFF unless MASQR_ENABLED=1.
      # MASQR_SECRET signs the access keys and is a real credential — declared
      # here because anything NOT listed silently resolves out of the committed
      # .env, which is exactly how a signing key ends up sourced from git.
      - key: MASQR_ENABLED
        sync: false
      - key: MASQR_SECRET
        sync: false
      - key: MASQR_KEY_TTL_DAYS
        sync: false
      - key: MASQR_DENY
        sync: false
      - key: MASQR_REDIRECT_TO
        sync: false
      # ── Wisp egress policy ────────────────────────────────────────────────
      # The rules governing the one endpoint that dials addresses strangers
      # choose. Declared here because anything NOT listed silently resolves out
      # of the committed .env — and a security boundary sourced from git is
      # exactly the outcome the note at the top of this block warns about.
      # All optional; lib/wisp-policy.mjs defaults are the safe values
      # (ports 80,443,8080,8443 · no UDP · private IPs blocked · 256 streams).
      - key: WISP_ALLOWED_PORTS
        sync: false
      - key: WISP_ALLOW_UDP
        sync: false
      - key: WISP_ALLOW_PRIVATE_IPS
        sync: false
      - key: WISP_ALLOW_LOOPBACK_IPS
        sync: false
      - key: WISP_MAX_STREAMS
        sync: false
      - key: WISP_BLOCKED_HOSTS
        sync: false
