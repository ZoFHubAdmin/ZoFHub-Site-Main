# ZoFHub — Render deploy blueprint (https://render.com).
# ─────────────────────────────────────────────────────────────────────────────
# WHY NOT VERCEL: ZoFHub is a PERSISTENT Express server — it runs node-cron jobs
# 24/7, holds the catalog + live-presence in memory, and serves the /wisp
# WebSocket tunnel for the proxy. Vercel's serverless functions can't do any of
# those. Use a persistent host: Render (this file), Railway, Fly.io, or a VPS.
#
# ZoFHub is ALWAYS a proxy site — the web proxy (GUST / Ultraviolet / Scramjet /
# Wisp) is always on. There is NO separate hub / Google-AdSense mode: Google bans
# proxy / anonymizer domains at the account level, so monetization is solely via
# proxy-friendly ad networks (Adsterra / HilltopAds / Monetag) configured through
# PROXY_AD_SCRIPTS + PROXY_BANNER_TAG. This is ONE service, deployed once.
#
# NOTE: the FREE plan SLEEPS when idle, which stops the cron jobs + live presence.
# Use the cheapest always-on paid plan ("starter") for real use. Render injects
# PORT automatically; server.js reads process.env.PORT.
#
# SCALING: if you ever run more than one replica, they share ONE database, so set
# CRON_DISABLED=1 on EVERY replica except one (otherwise every cron write runs N
# times). A single instance — the default below — needs no such flag.
services:
  - type: web
    name: zofhub
    runtime: node
    plan: starter
    buildCommand: npm ci
    # `npm start` on purpose, so there is ONE definition of how this server
    # starts. This used to be a literal `node server.js` while package.json's
    # start script was `node --use-system-ca server.js` — meaning the process
    # running in production was not the process anyone tested locally, and any
    # future flag added to the start script would silently not apply here.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # ── HOW ENV RESOLVES HERE (this bit is genuinely surprising) ─────────────
    # .env is COMMITTED in this repo, and server.js loads it at boot. Render's
    # own variables still win — process.loadEnvFile() never overwrites a value
    # already in the environment — but anything NOT declared below silently
    # falls back to whatever is in the committed .env. That is how a production
    # secret ends up being sourced from git without anyone deciding it should
    # be. So every secret the app reads is declared here, even the optional
    # ones; server.js also logs, in production, exactly which keys came from
    # the file instead of from this host.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SCORE_SECRET
        generateValue: true        # stable HMAC secret for score tokens
      # Unlocks /admin + /api/admin/scores/* so quarantined scores can be
      # reviewed. Auth FAILS CLOSED, so without it those routes 503 and flagged
      # scores pile up unreviewable (community-scores-review.sql deliberately
      # stops auto-deleting them). Generated here so it is NOT the value sitting
      # in the committed .env.
      - key: ADMIN_SECRET
        generateValue: true
      # --- set these as SECRETS in the Render dashboard (never commit them) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false                # the public/browser key; SUPABASE_PUBLISHABLE_KEY is accepted too (same value)
      # PREFERRED: the new-style secret key (sb_secret_…) from Settings → API
      # Keys. Bypasses RLS exactly like the legacy service_role JWT, which
      # Supabase retires at the end of 2026 and which can no longer be rotated.
      # Set THIS one; when both are present the secret key wins.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # LEGACY fallback — still works until Supabase turns it off.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Proxy-friendly ad loaders (comma-separated). Google/AdSense URLs are
      # auto-rejected server-side. Leave unset to run ad-free.
      - key: PROXY_AD_SCRIPTS
        sync: false
      - key: PROXY_BANNER_TAG
        sync: false                # optional single footer banner tag
      # The DMCA / privacy / terms contact shown on every legal page. Without it
      # those pages state that no contact address has been published — set this
      # so rights-holders and users actually have a way to reach you.
      - key: CONTACT_EMAIL
        sync: false
      - key: POLLINATIONS_REFERRER
        sync: false                # your domain (bare hostname), for AI attribution
      - key: CRON_SECRET
        sync: false                # protects /healthz; set the SAME value in your uptime monitor
      # Extra script origins for the Content-Security-Policy. The origins of
      # PROXY_AD_SCRIPTS / PROXY_BANNER_TAG are allowlisted automatically; set
      # this only when a network chains to a domain you never pasted. Without an
      # allowlist entry the BROWSER refuses the script — no error, no revenue,
      # and it looks exactly like the network not paying out. `npm run check-ads`
      # reports this before you find out the slow way.
      - key: PROXY_AD_ORIGINS
        sync: false
      - key: ADS_TXT_EXTRA
        sync: false                # only if a network hands you an ads.txt line
      # Public site URL (https://…). Without it the legal pages say "this
      # website" instead of naming the site, which reads badly on a DMCA policy.
      - key: SITE_URL
        sync: false
      # Free public pk_ key from enter.pollinations.ai — lifts the anonymous
      # per-IP limit on the AI chat. PUBLIC by design (it reaches the browser);
      # never put a secret sk_ key here.
      - key: POLLINATIONS_PUBLIC_KEY
        sync: false
      # Optional Redis. Unset = a bounded in-process LRU, which is fine for ONE
      # instance but is not shared, so each replica would cache separately.
      - key: REDIS_URL
        sync: false
      # Optional tuning. SCORES_KEEP_PER_GAME defaults to 200.
      - key: SCORES_KEEP_PER_GAME
        sync: false
      # Set to 1 on EVERY replica except one if you ever scale past a single
      # instance — otherwise every cron write runs once per replica.
      - key: CRON_DISABLED
        sync: false
